name: Build AnonPing APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null
          sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Build pinned hev-socks5-tunnel native library
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/hev-socks5-tunnel"
          git clone https://github.com/heiher/hev-socks5-tunnel.git "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout bd6f919922c30a347fdc645882ec71494520ef83
          git -C "$SOURCE_DIR" submodule update --init --recursive

          # Patch the MIT-licensed native tunnel at the IP-packet boundary.
          # This lets TCP retransmission and UDP datagram-drop behavior happen
          # at the packet layer rather than faking loss in a SOCKS byte stream.
          python3 "$GITHUB_WORKSPACE/tools/patch_hev_packet_loss.py" "$SOURCE_DIR"

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs"
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" \
            NDK_PROJECT_PATH="$SOURCE_DIR" \
            APP_BUILD_SCRIPT="$SOURCE_DIR/Android.mk" \
            NDK_APPLICATION_MK="$SOURCE_DIR/Application.mk" \
            NDK_OUT="$RUNNER_TEMP/hev-obj" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs"

          test -f "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"
          test -f "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so"
          echo "Native library built and copied into app/src/main/jniLibs."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnonPing-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
